<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flashcards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .flashcard {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        #answer {
            margin: 20px 0;
            color: green;
            font-weight: bold;
            display: none;
        }

        button {
            padding: 10px 18px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #progress {
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="flashcard">
        <h2 id="question"></h2>

        <p id="answer"></p>

        <button id="showAnswer">Show Answer</button>
        <button id="nextCard">Next</button>

        <p id="progress"></p>
    </div>

    <script>
        // Array of flashcards
        const cards = [
            {
                question: "What does HTTP stand for?",
                answer: "HyperText Transfer Protocol"
            },
            {
                question: "What status code means 'Not Found'?",
                answer: "404"
            },
            {
                question: "What does CSS stand for?",
                answer: "Cascading Style Sheets"
            },
            {
                question: "What does DOM stand for?",
                answer: "Document Object Model"
            },
            {
                question: "What Python library is commonly used for HTTP requests?",
                answer: "requests"
            }
        ];

        // Track the current flashcard
        let currentIndex = 0;

        // Get page elements
        const question = document.getElementById("question");
        const answer = document.getElementById("answer");
        const progress = document.getElementById("progress");
        const showAnswerButton = document.getElementById("showAnswer");
        const nextButton = document.getElementById("nextCard");

        // Display the current flashcard
        function displayCard() {
            question.textContent = cards[currentIndex].question;
            answer.textContent = cards[currentIndex].answer;
            answer.style.display = "none";
            progress.textContent = `Card ${currentIndex + 1} of ${cards.length}`;
        }

        // Toggle the answer visibility
function toggleAnswer() {
    if (answer.style.display === "none") {
        answer.style.display = "block";
    } else {
        answer.style.display = "none";
    }
}

        // Show the answer
        showAnswerButton.addEventListener("click", function () {
            toggleAnswer();
        });

        // Move to the next flashcard
        nextButton.addEventListener("click", function () {
            currentIndex = (currentIndex + 1) % cards.length;
            displayCard();
        });

        // Display the first card when the page loads
        displayCard();

        // Keyboard navigation
document.addEventListener("keydown", function (event) {

    // Right Arrow = Next Card
    if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % cards.length;
        displayCard();
    }

    // Left Arrow = Previous Card
    else if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        displayCard();
    }

    // Space Bar = Show/Hide Answer
    else if (event.key === " ") {
        event.preventDefault(); // Prevent page scrolling
        toggleAnswer();
    }

});
    </script>

</body>
</html>
