<!DOCTYPE html>
<!--
  L4 — Interactive Flashcard App
  ================================
  Demonstrates core JavaScript concepts:
    • let vs const
    • querySelector / querySelectorAll
    • addEventListener
    • textContent  vs innerHTML
    • style.display to show/hide elements
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Dev Flashcards</title>
  <style>
    /* ── Basic page reset and centering ────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    /* ── Flashcard container ─────────────────────────────────────────── */
    .card {
      background: #16213e;
      border: 2px solid #e94560;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* Progress indicator */
    .progress {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 1rem;
    }

    /* Question text */
    .question {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    /* Answer text — hidden by default using display:none */
    .answer {
      font-size: 1rem;
      background: #0f3460;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
      /* display: none hides the element AND removes it from the layout */
      display: none;
    }

    /* ── Buttons ──────────────────────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    #show-btn {
      background: #e94560;
      color: #fff;
    }
    #show-btn:hover { background: #c73652; }

    #next-btn {
      background: #0f3460;
      color: #fff;
      border: 1px solid #e94560;
    }
    #next-btn:hover { background: #1a4a80; }
  </style>
</head>
<body>

  <h1>Web Dev Flashcards</h1>

  <div class="card">
    <p class="progress" id="progress">Card 1 of 5</p>
    <p class="question" id="question">Loading…</p>
    <div class="answer" id="answer">Loading…</div>
    <div class="btn-row">
      <button id="show-btn">Show Answer</button>
      <button id="next-btn">Next →</button>
    </div>
  </div>

  <script>
    /*
      ── Data ──────────────────────────────────────────────────────────────
      const vs let:
        const — the variable binding cannot be reassigned. The object/array
                *contents* can still be mutated. Use const by default.
        let   — can be reassigned. Use when you need to change the value
                (e.g. a counter).
    */
    const cards = [
      {
        question: "What are the four main HTTP methods and what does each one do?",
        answer: "GET — retrieve data | POST — create a resource | PUT/PATCH — update a resource | DELETE — remove a resource"
      },
      {
        question: "What is the difference between a class selector and an ID selector in CSS?",
        answer: "A class selector (.name) can be applied to many elements. An ID selector (#name) must be unique per page and has higher specificity."
      },
      {
        question: "What is the DOM and how does JavaScript interact with it?",
        answer: "The DOM (Document Object Model) is a tree representation of the HTML page. JavaScript can read and modify it with methods like querySelector(), textContent, and addEventListener()."
      },
      {
        question: "What does an HTTP 200 status code mean? What about 404 and 500?",
        answer: "200 = OK (success). 404 = Not Found (the resource doesn't exist). 500 = Internal Server Error (something went wrong on the server)."
      },
      {
        question: "What is the difference between async/await and traditional callbacks?",
        answer: "async/await lets you write asynchronous code that looks synchronous. It is built on Promises and makes error handling easier with try/catch, avoiding deeply nested 'callback hell'."
      }
    ];

    /*
      ── State variables ────────────────────────────────────────────────
      let is used here because both values will change as the user clicks.
    */
    let currentIndex = 0;       // which card are we on?
    let answerVisible = false;  // is the answer currently shown?

    /*
      ── DOM references ────────────────────────────────────────────────
      querySelector(selector) searches the document and returns the FIRST
      matching element, or null if nothing matches.
      We cache the references in const variables so we don't re-query
      the DOM every time.
    */
    const progressEl = document.querySelector('#progress');
    const questionEl = document.querySelector('#question');
    const answerEl   = document.querySelector('#answer');
    const showBtn    = document.querySelector('#show-btn');
    const nextBtn    = document.querySelector('#next-btn');

    /* ── renderCard() — update the UI to match the current state ─────── */
    function renderCard() {
      const card = cards[currentIndex];

      // textContent sets the text inside an element (safe — no HTML injection)
      progressEl.textContent = `Card ${currentIndex + 1} of ${cards.length}`;
      questionEl.textContent = card.question;
      answerEl.textContent   = card.answer;

      // Toggle answer visibility using style.display
      // "none"  = hidden (the element takes up no space)
      // "block" = visible (rendered as a block)
      answerEl.style.display = answerVisible ? "block" : "none";

      // Update button label to reflect current state
      showBtn.textContent = answerVisible ? "Hide Answer" : "Show Answer";
    }

    /* ── Event listeners ─────────────────────────────────────────────
       addEventListener(event, callback) registers a function to run
       whenever the named event fires on the element.
       "click" fires when the element is clicked (mouse or keyboard Enter).
    */

    // "Show Answer" / "Hide Answer" button
    showBtn.addEventListener("click", function () {
      // Toggle: if visible → hide; if hidden → show
      answerVisible = !answerVisible;
      renderCard();
    });

    // "Next →" button
    nextBtn.addEventListener("click", function () {
      // Modulo arithmetic wraps around: after card 5 (index 4), back to 0
      // (4 + 1) % 5 = 0  ✓
      currentIndex = (currentIndex + 1) % cards.length;
      answerVisible = false;  // always hide the answer on a new card
      renderCard();
    });

    // ── Initial render ───────────────────────────────────────────────
    renderCard();
  </script>

</body>
</html>
