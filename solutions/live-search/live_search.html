<!DOCTYPE html>
<!--
  L5 — API-Powered Live Search
  ==============================
  Demonstrates:
    • fetch() with async/await
    • response.ok check before parsing JSON
    • try / catch / finally pattern
    • Loading and error states
    • Filtering data and re-rendering the DOM on every keystroke
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live User Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 2rem 1rem;
    }

    h1 { text-align: center; margin-bottom: 0.25rem; color: #1a1a2e; }

    .subtitle { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }

    /* Search input */
    .search-bar {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar:focus { border-color: #e94560; }

    /* Result count */
    .result-count {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1.25rem;
    }

    /* Status messages */
    .status {
      text-align: center;
      padding: 2rem;
      color: #666;
      font-style: italic;
    }
    .error { color: #c0392b; }

    /* User card grid */
    .user-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .user-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid #e94560;
    }

    .user-card h3 { font-size: 1rem; margin-bottom: 0.25rem; color: #1a1a2e; }
    .user-card .email { font-size: 0.85rem; color: #e94560; margin-bottom: 0.5rem; }
    .user-card .city  { font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>

  <h1>User Directory</h1>
  <p class="subtitle">Data from JSONPlaceholder — type to filter</p>

  <input
    type="search"
    class="search-bar"
    id="search-input"
    placeholder="Search by name or email…"
    aria-label="Search users"
  />

  <p class="result-count" id="result-count"></p>
  <div id="status" class="status">Loading users…</div>
  <div class="user-grid" id="user-grid"></div>

  <script>
    /*
      ── State ──────────────────────────────────────────────────────────────
      allUsers stores every user fetched from the API.
      We keep this so we can re-filter without another network request.
    */
    let allUsers = [];

    // ── DOM references ──────────────────────────────────────────────────
    const searchInput  = document.querySelector('#search-input');
    const resultCount  = document.querySelector('#result-count');
    const statusDiv    = document.querySelector('#status');
    const userGrid     = document.querySelector('#user-grid');

    /*
      ── fetchUsers() ───────────────────────────────────────────────────
      async/await pattern:
        • Declare the function with `async` so we can use `await` inside it.
        • `await` pauses the function until the Promise resolves.
        • The function returns a Promise that the caller can await.

      try / catch / finally:
        try   — code that might throw (network errors, JSON parse errors)
        catch — runs if anything in try throws; `err` holds the error
        finally — ALWAYS runs, whether or not an error occurred
                  (great for hiding loading spinners)
    */
    async function fetchUsers() {
      try {
        // fetch() returns a Promise that resolves to a Response object.
        // `await` unwraps the Promise and gives us the Response directly.
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        /*
          response.ok is true when the status code is in the 200-299 range.
          We check this BEFORE calling response.json() because a 404 or 500
          response still resolves the fetch Promise — it doesn't throw.
          If we skip this check, response.json() might parse an HTML error page.
        */
        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        // response.json() parses the response body as JSON.
        // It also returns a Promise, so we await it.
        allUsers = await response.json();

        statusDiv.style.display = "none";  // hide the loading message
        renderUsers(allUsers);             // show all users initially

      } catch (err) {
        // Network errors (offline, DNS failure) throw here.
        // Our manual `throw new Error(...)` above also ends up here.
        statusDiv.className = "status error";
        statusDiv.textContent = `Failed to load users: ${err.message}. Is your internet connected?`;

      } finally {
        // This runs whether the fetch succeeded or failed.
        // A real app would hide a spinner here.
        console.log("fetchUsers() completed (success or failure).");
      }
    }

    /*
      ── renderUsers(users) ─────────────────────────────────────────────
      Takes an array of user objects and builds the DOM.
      Called on initial load AND every time the search query changes.
    */
    function renderUsers(users) {
      // Update the result count
      resultCount.textContent = `Showing ${users.length} of ${allUsers.length} users`;

      // Clear previous cards before adding new ones
      userGrid.innerHTML = "";

      if (users.length === 0) {
        userGrid.innerHTML = '<p class="status">No users match your search.</p>';
        return;
      }

      // Build one card per user and append to the grid
      users.forEach(function (user) {
        const card = document.createElement("div");
        card.className = "user-card";

        // innerHTML is fine here because the data comes from a trusted API,
        // not from user input (which could contain malicious HTML).
        card.innerHTML = `
          <h3>${user.name}</h3>
          <p class="email">${user.email}</p>
          <p class="city">📍 ${user.address.city}</p>
        `;

        userGrid.appendChild(card);
      });
    }

    /*
      ── Live search: filter on every keystroke ──────────────────────
      The "input" event fires every time the value of the input changes —
      after each character typed, deleted, or pasted.
      (The "change" event only fires when the input loses focus — too slow.)
    */
    searchInput.addEventListener("input", function () {
      const query = searchInput.value.toLowerCase().trim();

      if (query === "") {
        // Empty search → show everyone
        renderUsers(allUsers);
        return;
      }

      // Filter: keep users whose name OR email includes the query string
      const filtered = allUsers.filter(function (user) {
        return (
          user.name.toLowerCase().includes(query) ||
          user.email.toLowerCase().includes(query)
        );
      });

      renderUsers(filtered);
    });

    // ── Start the app ────────────────────────────────────────────────
    fetchUsers();
  </script>

</body>
</html>
